name: Apply CortexLite upgrade
on:
  push:
    branches:
      - feat/simd-int8-parallel-benchmarks
    paths:
      - .github/workflows/import-upgrade.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify upgrade and extract reviewed source
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .cortexlite-upgrade/payload.b64 > /tmp/cortexlite-upgrade.tar.xz
          echo "bf0b69fe5eb7ee3a05155ffa3b8bcf04f4ee98e934f619e33241bbd6ba2c026e  /tmp/cortexlite-upgrade.tar.xz" | sha256sum --check
          tar -xJf /tmp/cortexlite-upgrade.tar.xz
      - name: Commit upgraded project files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md CMakeLists.txt include src tests benchmarks scripts docs reports
          git commit -m "feat: SIMD INT8 threaded inference and reproducible DSA benchmarks"
          git push origin HEAD:feat/simd-int8-parallel-benchmarks
