name: CI
on:
  push:
  pull_request:
jobs:
  native-build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel 2
      - name: Native and end-to-end tests
        run: ctest --test-dir build --output-on-failure
      - name: Verify example evaluation thresholds
        run: python3 python/check_metrics.py --binary ./build/cortexlite
