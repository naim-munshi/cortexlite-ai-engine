name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  native-build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel 2
      - name: Regression and integration tests
        run: ctest --test-dir build --output-on-failure
      - name: Show reproducible CLI demo
        run: ./build/cortexlite demo --x 1.8 --y -2.0 --k 3 --search exact
      - name: Verify one-command recruiter showcase
        if: matrix.os == 'ubuntu-latest'
        run: bash scripts/showcase.sh
      - name: Verify example accuracy thresholds
        run: python3 python/check_metrics.py --binary ./build/cortexlite
      - name: Independently verify native inference numerics (Python stdlib)
        run: python3 python/verify_native_reference.py --binary ./build/cortexlite
      - name: Validate CMake-free native build on both operating systems
        run: CORTEXLITE_FORCE_NATIVE=1 bash scripts/showcase.sh
      - name: Five repeated benchmarks (CI runner, not production)
        if: matrix.os == 'ubuntu-latest'
        run: python3 scripts/run_benchmarks.py --repetitions 5 --iterations 3000 --vectors 1000 --output reports/ci-benchmarks.json
      - name: Preserve raw measured benchmark evidence
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: cortexlite-benchmarks-${{ github.sha }}
          path: |
            reports/ci-benchmarks.json
            reports/ci-benchmarks.csv
          retention-days: 30
  sanitizer-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure ASan + UBSan
        run: cmake -S . -B build-sanitize -DCMAKE_BUILD_TYPE=Debug -DCORTEXLITE_SANITIZERS=ON
      - name: Build
        run: cmake --build build-sanitize --parallel 2
      - name: Address and undefined behavior tests
        run: ctest --test-dir build-sanitize --output-on-failure
