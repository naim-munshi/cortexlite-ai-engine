<title id="title">CortexLite CLI demonstration output</title>
<desc id="desc">GitHub Actions verified terminal transcript for an input of 1.8 and minus 2.0, with predicted class 1, confidence 0.9999, and three nearest neighbors from the native C plus C++ engine.</desc>
<rect width="900" height="385" rx="13" fill="#0f172a"/>
<path d="M13 0h874a13 13 0 0 1 13 13v37H0V13A13 13 0 0 1 13 0Z" fill="#1e293b"/>
