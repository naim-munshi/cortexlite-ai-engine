<text x="24" y="218" fill="#cbd5e1">precision: fp32       kernel: scalar</text>
<text x="24" y="244" fill="#cbd5e1">weight_storage_bytes: 204      index_size: 18</text>
<text x="24" y="270" fill="#cbd5e1">search: exact</text>
