<text x="450" y="30" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#cbd5e1">CortexLite · CI-verified CLI demo · synthetic dataset</text>
<g font-family="Menlo,Consolas,monospace" font-size="15" xml:space="preserve">
<text x="24" y="80" fill="#86efac">$ ./build/cortexlite demo --x 1.8 --y -2.0 --k 3 --search exact</text>
